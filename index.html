<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ParentConnect AI</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      color: #183153;
      background: #f2f7fc;
      text-align: center;
    }
    main {
      max-width: 620px;
      padding: 40px 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 35px #18315318;
    }
    h1 { margin-top: 0; }
    p { line-height: 1.6; }
    .note { font-size: 0.9rem; color: #52657a; }
  </style>
</head>
<body>
  <main>
    <h1>ParentConnect AI</h1>
    <p>Ask about attendance, exams, fees, school timings, and other school enquiries.</p>
    <p><strong>Click the chat icon in the bottom-right corner to begin.</strong></p>
    <p class="note">This demonstration does not access live student records or confirmed school schedules. Please check official school sources for those details.</p>
  </main>

  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
  <df-messenger
    intent="WELCOME"
    chat-title="ParentConnect AI"
    agent-id="9deddf2d-968b-4071-8818-744f19308bb1"
    language-code="en"
  ></df-messenger>
</body>
</html>
